[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "gobahar"
version = "0.1.0"
description = "Reusable tools for the Golbahar subsidence research workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Soroush Yasini"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "rasterio>=1.4,<2",
    "pyproj>=3.6,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.0",
    "build==1.3.0",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "ipykernel>=6.29,<7",
]
research = [
    "geopandas>=1.0,<2",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<0.14",
    "folium>=0.18,<1",
    "plotly>=5.24,<7",
    "contextily>=1.6,<2",
    "jdatetime>=5,<6",
    "requests>=2.32,<3",
    "jinja2>=3.1,<4",
    "xlrd>=2,<3",
    "jupyterlab>=4.3,<5",
]

[project.urls]
Repository = "https://github.com/soroushyasini/gobahar_codebase"
Issues = "https://github.com/soroushyasini/gobahar_codebase/issues"

[project.scripts]
gobahar = "gobahar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=gobahar --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["notebooks/*.ipynb"]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["gobahar"]
