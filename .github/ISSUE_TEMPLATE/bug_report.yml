name: Bug report
description: Report a reproducible code or analysis problem
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, minimal input, and error. Omit sensitive data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and scientific metadata
      description: OS, Python/package versions, CRS, units, date format, and missing-data markers.
    validations:
      required: true
