name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Regression tests and coverage
        run: python -m pytest
      - name: Notebook structure
        run: python scripts/check_notebooks.py
      - name: Build distribution
        run: python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m pip uninstall -y gobahar
          python -m pip install --no-deps dist/*.whl
          gobahar --help
          gobahar pass-direction research/sentinel_metadata/manifest.safe
