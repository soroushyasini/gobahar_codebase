name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Regression tests and coverage
        run: python -m pytest
      - name: Notebook structure
        run: python scripts/check_notebooks.py
      - name: Build distribution
        run: python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m pip uninstall -y gobahar
          python -m pip install --no-deps dist/*.whl
          gobahar --help
          gobahar pass-direction research/sentinel_metadata/manifest.safe
